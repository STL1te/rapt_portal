[project]
name = "rapt-portal-backend"
version = "0.1.0"
description = "FastAPI proxy + cache for RAPT API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "sqlalchemy>=2.0",
    "python-dotenv>=1.0",
    "alembic>=1.18.5",
    "psycopg[binary]>=3.3.4",
    "openai>=1.0",
]

[dependency-groups]
dev = [
    "ruff>=0.15.22",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
extend-select = ["I"]
